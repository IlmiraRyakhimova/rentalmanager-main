# Docker Compose с поддержкой profiles: local и prod
#
# ЛОКАЛЬНАЯ РАЗРАБОТКА:
#   docker compose --profile local up -d --build
#
# PRODUCTION:
#   docker compose --profile prod up -d --build
#
# Остановка:
#   docker compose --profile local down
#   docker compose --profile prod down

services:
  # ================== ОБЩИЕ СЕРВИСЫ ==================
  
  postgres-db:
    image: postgres:15
    container_name: rental-postgres
    profiles: ["local", "prod"]
    environment:
      POSTGRES_DB: rental_manager
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: rental-redis
    profiles: ["local", "prod"]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ================== LOCAL: MailHog для email ==================
  
  mailhog:
    image: mailhog/mailhog:latest
    container_name: rental-mailhog
    profiles: ["local"]
    ports:
      - "1025:1025"   # SMTP порт
      - "8025:8025"   # Web UI для просмотра email
    restart: unless-stopped

  # ================== LOCAL: Backend ==================
  
  backend-local:
    build: ./main-service
    container_name: rental-backend-local
    profiles: ["local"]
    networks:
      default:
        aliases:
          - backend-service
    volumes:
      - ./main-service/src:/app/src
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/rental_manager
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_key_min_32_characters_long}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      # MailHog для локальной отправки email
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-test@localhost}
      EMAIL_PASSWORD: ""
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      # Локальные URL
      APP_BACKEND_URL: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:3000
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    restart: unless-stopped

  # ================== LOCAL: Frontend ==================
  
  frontend-local:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: rental-frontend-local
    profiles: ["local"]
    ports:
      - "3000:80"
    depends_on:
      - backend-local
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  # ================== PROD: Backend ==================
  
  backend-prod:
    build: ./main-service
    container_name: rental-backend
    profiles: ["prod"]
    networks:
      default:
        aliases:
          - backend-service
    volumes:
      - ./main-service/src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/rental_manager
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      # Production URL
      APP_BACKEND_URL: https://managerrent.com
      APP_FRONTEND_URL: https://managerrent.com
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ================== PROD: Frontend ==================
  
  frontend-prod:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://managerrent.com
    container_name: rental-frontend
    profiles: ["prod"]
    ports:
      - "3000:80"
    depends_on:
      - backend-prod
    environment:
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  postgres_data:


# ================== ИНСТРУКЦИИ ==================
#
# ЛОКАЛЬНАЯ РАЗРАБОТКА:
#   1. Создайте .env файл (опционально, есть значения по умолчанию)
#   2. docker compose --profile local up -d --build
#   3. Frontend: http://localhost:3000
#   4. Backend API: http://localhost:8080
#   5. MailHog UI: http://localhost:8025 (для просмотра email)
#
# PRODUCTION:
#   1. Создайте .env файл с реальными значениями
#   2. docker compose --profile prod up -d --build
#
# ПРОСМОТР ЛОГОВ:
#   docker compose --profile local logs -f
#   docker compose --profile prod logs -f