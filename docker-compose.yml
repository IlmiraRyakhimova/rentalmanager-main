services:
  postgres-db:
    image: postgres:15
    container_name: rental-postgres
    environment:
      POSTGRES_DB: rental_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 10s
      retries: 10

  backend-service:
    build: ./main-service
    container_name: rental-backend
    volumes:
      - ./main-service/src:/app/src
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/rental_manager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy


# запуск:
#       docker-compose up -d (--build - для пересборки образов)
# остановка:
#       docker-compose down
# просмотр логов:
#       docker-compose logs -f