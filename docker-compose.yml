services:
  postgres-db:
    image: postgres:15
    container_name: rental-postgres
    environment:
      POSTGRES_DB: rental_manager
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-service:
    build: ./main-service
    container_name: rental-backend
    volumes:
      - ./main-service/src:/app/src
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/rental_manager
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      TZ: Europe/Moscow
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend-service:
    build: ./front
    container_name: rental-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-service
    environment:
      - NODE_ENV=production
  redis:
    image: redis:7.2
    container_name: rental-redis
    ports:
      - "6379:6379"
    restart: unless-stopped



# запуск:
#       docker-compose up -d (--build - для пересборки образов)
# остановка:
#       docker-compose down
# просмотр логов:
#       docker-compose logs -f
# только фронтенд:
#       docker-compose up -d frontend-service --build