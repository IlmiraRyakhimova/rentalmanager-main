spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/rental_manager
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml

logging:
  level:
    org.springframework.jdbc.core: DEBUG
    liquibase: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
